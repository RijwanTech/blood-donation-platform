<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <header>
        <h2>Contact Form</h2>
    </header>

    <form action="/action.php">
        <input type="text" placeholder="Name" name="name" required>
        <br><br>
        <input type="email" placeholder="Email" name="email" required>
        <br><br>
        <input type="password" placeholder="Password" name="password" required>
        <br><br>

        <label>Select your city:</label>
        <br>
        <select name="city">
            <option value="Aurangabad">Aurangabad</option>
            <option value="Parbhani">Parbhani</option>
            <option value="Pune">Pune</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <h3>Select your Profession:</h3>
        <label>
            <input type="radio" value="Student" name="profession"> Student
        </label><br>
        <label>
            <input type="radio" value="Government Employee" name="profession"> Government Employee
        </label><br>
        <label>
            <input type="radio" value="Farmer" name="profession"> Farmer
        </label><br>
        <label>
            <input type="radio" value="Businessman" name="profession"> Businessman
        </label><br>
        <label>
            <input type="radio" value="Private Employee" name="profession"> Private Employee
        </label>
        <br><br>

        <label>Select your Gender:</label>
        <br>
        <select name="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <h3>Select your problems:</h3>
        <label>
            <input type="checkbox" value="Financial Problem" name="problem"> Financial Problem
        </label><br>
        <label>
            <input type="checkbox" value="Harassment Problem" name="problem"> Harassment Problem
        </label><br>
        <label>
            <input type="checkbox" value="Unequal Treatment Problem" name="problem"> Unequal Treatment Problem
        </label><br>
        <label>
            <input type="checkbox" value="Health Problem" name="problem"> Health Problem
        </label><br>
        <label>
            <input type="checkbox" value="Education Problem" name="problem"> Education Problem
        </label>
        <br><br>

        <textarea name="message" placeholder="Please share your problem" rows="5" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
